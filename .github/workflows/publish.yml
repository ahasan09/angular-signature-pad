name: Publish

# Publishes with npm trusted publishing (OIDC): npm exchanges this workflow's
# GitHub identity token for a short-lived publish credential, so no npm token
# is stored in the repository. The trusted publisher is configured on
# npmjs.com for this repository and the workflow file name "publish.yml".

on:
  push:
    tags:
      - 'v3.*'

permissions:
  contents: read
  id-token: write # trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # 3.x (Angular 19-22) is the current line and publishes as "latest".
      # Older lines live on release/v1 and release/v2 and publish under their own dist-tags.
      RELEASE_MAJOR: "3"
      DIST_TAG: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No dependency cache in release builds (npm's recommendation for publishing).
      - name: Setup Node.js 22 (build and test)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (for browser tests)
        run: npx playwright install --with-deps chromium

      - name: Verify tag matches library version and release line
        run: |
          LIB_VERSION=$(node -p "require('./projects/ngx-signature-pad/package.json').version")
          if [ "v$LIB_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match library version v$LIB_VERSION" >&2
            exit 1
          fi
          if [ "${LIB_VERSION%%.*}" != "$RELEASE_MAJOR" ]; then
            echo "This branch publishes $RELEASE_MAJOR.x only (got $LIB_VERSION)" >&2
            exit 1
          fi

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build library
        run: npm run build

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14, independent of
      # the Node version used to build this line.
      - name: Setup Node.js 24 (publish)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use npm 11
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Publish package
        run: npm publish ./dist/ngx-signature-pad --access public --provenance --tag "$DIST_TAG"
