name: Publish

on:
  push:
    tags:
      - 'v3.*'

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # 3.x (Angular 19-22) is the current line and publishes as "latest".
      # Older lines live on release/v1 and release/v2 and publish under their own dist-tags.
      RELEASE_MAJOR: "3"
      DIST_TAG: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (for browser tests)
        run: npx playwright install --with-deps chromium

      - name: Verify tag matches library version and release line
        run: |
          LIB_VERSION=$(node -p "require('./projects/ngx-signature-pad/package.json').version")
          if [ "v$LIB_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match library version v$LIB_VERSION" >&2
            exit 1
          fi
          if [ "${LIB_VERSION%%.*}" != "$RELEASE_MAJOR" ]; then
            echo "This branch publishes $RELEASE_MAJOR.x only (got $LIB_VERSION)" >&2
            exit 1
          fi

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build library
        run: npm run build

      - name: Publish package
        run: npm publish dist/ngx-signature-pad --access public --provenance --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
