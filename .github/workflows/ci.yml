name: CI (1.x, Angular 13-15)

on:
  push:
    branches: [release/v1]
  pull_request:
    branches: [release/v1]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only the published runtime dependencies (signature_pad, tslib) are audited.
      # The Angular 13-15 build toolchain is end-of-life and has known, unfixable advisories.
      - name: Audit published dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run tests
        run: npm test

      - name: Build library
        run: npm run build

      - name: Check package contents
        run: npm pack --dry-run ./dist/ngx-signature-pad
